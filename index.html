<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muslimworld Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css?v=5.0">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Muslimworld</h2>
            <button id="close-sidebar"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="auth-section" id="auth-section">
            <button id="google-login-btn" class="google-btn">
                <i class="fa-brands fa-google"></i> Sign in with Google
            </button>
            
            <div id="user-profile" style="display: none; align-items: center; gap: 15px; padding: 10px;">
                <img id="user-avatar" src="" alt="Avatar" style="width: 40px; height: 40px; border-radius: 50%;">
                <div>
                    <strong id="user-name" style="display: block; font-size: 0.9rem; color: #1f2937;"></strong>
                    <span style="font-size: 0.75rem; color: #559e70;">Cloud Synced ✅</span>
                </div>
                <button id="logout-btn" style="background:none; border:none; color:#ef4444; margin-left:auto; cursor:pointer;">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>

        <div class="sidebar-links">
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="aim.html"><i class="fa-solid fa-bullseye"></i> Our Aim</a>
            <a href="developer.html"><i class="fa-solid fa-code"></i> Developer</a>
            <a href="join.html"><i class="fa-solid fa-users"></i> Need Developers</a>
            <a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact Us</a>
        </div>
    </div>

    <div class="container">
        <div class="top-bar">
            <button class="menu-btn" id="open-sidebar-btn"><i class="fa-solid fa-bars"></i></button>
            <div class="title">Muslimworld</div>
            <button class="icon-btn"><i class="fa-solid fa-book-open"></i></button>
            <button class="remove-ads-btn">Remove Ads</button>
        </div>

        <header class="hero">
            <div class="prayer-times">
                <h3>Now</h3>
                <h1 id="current-prayer-name">...</h1>
                <div class="upcoming">upcoming<br><strong id="upcoming-prayer-name">...</strong><br><span
                        id="upcoming-prayer-time">...</span></div>
            </div>
            <div class="hero-center-img">
                <i class="fa-solid fa-mosque"></i>
            </div>
            <div class="islamic-date">
                <h1 id="hijri-day">...</h1>
                <h3><span id="hijri-month-year">...</span><br><span id="gregorian-date">...</span></h3>
            </div>
        </header>

        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="main-search-input" placeholder="Search Surah name or Ayah (e.g. 2:255)">
                <span class="ai-badge"><i class="fa-solid fa-sparkles"></i> IslamicAi</span>
            </div>
        </div>

        <div class="main-banner" style="margin-top: 30px;">
            <div class="banner-text">
                <h2 class="ayah-arabic" style="font-size: 2.2rem; margin-bottom: 10px;">القرآن الكريم</h2>
                <a href="surah-list.html" style="text-decoration: none;">
                    <button class="read-btn">Read Quran</button>
                </a>
            </div>
            <div class="banner-img">
                <i class="fa-solid fa-book-quran"></i>
            </div>
        </div>

        <div class="grid-menu">
            <a href="surah-list.html" style="text-decoration: none; color: inherit;">
                <div class="grid-card">
                    <i class="fa-solid fa-book-open-reader"></i>
                    <h3>Al-Quran</h3>
                </div>
            </a>
            <div class="grid-card" id="sync-test-btn">
                <span class="new-badge">NEW</span>
                <i class="fa-solid fa-robot" style="color: #10b981;"></i>
                <h3>Search with IslamicAi</h3>
            </div>
            <a href="seerat.html" style="text-decoration: none; color: inherit;">
                <div class="grid-card">
                    <i class="fa-solid fa-star-and-crescent"></i>
                    <h3>Seerat un Nabi</h3>
                </div>
            </a>
            <div class="grid-card">
                <i class="fa-solid fa-lines-leaning"></i>
                <h3>15 line Quran</h3>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active"><i class="fa-solid fa-book-quran"></i><span>Quran</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-book"></i><span>Hadith</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-hands-praying"></i><span>Ibadaat</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-ellipsis"></i><span>More</span></a>
        </nav>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
