<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Muslimworld</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f9fafb;">

<div class="container">
    <div class="info-page-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 style="font-size: 1.5rem;">Contact Us</h1>
    </div>

    <div class="info-content">
        <div class="info-card-box">
            <p style="margin-bottom: 20px; text-align: center;">Have a question, found a bug, or want to suggest a new feature? We would love to hear from you!</p>
            
            <div class="contact-form">
                <input type="text" placeholder="Your Name">
                <input type="email" placeholder="Your Email Address">
                <input type="text" placeholder="Subject">
                <textarea placeholder="Write your message here..."></textarea>
                <button type="button" onclick="alert('Thank you! Your message has been sent.')">Send Message</button>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 20px; color: #6b7280; font-size: 0.85rem;">
            <p><i class="fa-solid fa-envelope" style="margin-right: 5px;"></i> support@muslimworld.app</p>
        </div>
    </div>
</div>

</body>
</html>
