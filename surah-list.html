<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surah List - Muslimworld</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Lateef:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body style="background-color: #f3f4f6;">

    <div class="container">
        <div class="list-top-bar">
            <a href="index.html" id="list-back-btn" style="color: white; text-decoration: none;"><i
                    class="fa-solid fa-arrow-left"></i></a>
            <div class="title" style="color: white; font-weight: 600;" id="page-title">Quran</div>
            <button style="color: white; background: none; border: none; font-size: 1.2rem;"><i
                    class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="info-card-wrapper" id="info-card-section">
            <div class="info-card">
                <div class="last-activity-row">
                    <div class="activity-col" id="last-seen-btn">
                        <div class="activity-header">Last Seen <span id="last-seen-time"></span></div>
                        <div class="activity-box bg-green-light">
                            <i class="fa-solid fa-eye"></i>
                            <div class="activity-text">
                                <strong id="last-seen-surah">Not set</strong>
                                <span id="last-seen-ayah"></span>
                            </div>
                        </div>
                    </div>
                    <div class="activity-col" id="last-audio-btn">
                        <div class="activity-header">Last Audio</div>
                        <div class="activity-box bg-green-dark">
                            <i class="fa-solid fa-headphones"></i>
                            <div class="activity-text">
                                <strong id="last-audio-surah">Not set</strong>
                                <span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="quick-links list-quick-links">
                    <a href="#" class="link-item"><i class="fa-solid fa-ban" style="color:#22c55e;"></i>
                        <p>Do & Don't</p>
                    </a>
                    <a href="#" class="link-item" id="open-bookmarks-btn">
                        <i class="fa-regular fa-bookmark" style="color:#22c55e;"></i>
                        <p>Bookmarks</p>
                    </a>
                    <a href="#" class="link-item"><i class="fa-regular fa-note-sticky" style="color:#22c55e;"></i>
                        <p>Notes</p>
                    </a>
                    <a href="#" class="link-item"><i class="fa-regular fa-circle-question" style="color:#22c55e;"></i>
                        <p>FAQ</p>
                    </a>
                </div>
            </div>
        </div>

        <div id="tabs-section">
            <div class="list-tabs">
                <div class="list-tab active" data-target="surah">BY SURAH</div>
                <div class="list-tab" data-target="juz">BY PARAH</div>
                <div class="list-tab" data-target="favourite">FAVOURITE</div>
            </div>
        </div>

        <div id="surah-list-container" class="surah-list-container">
            <div class="loader" id="list-loader"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading Data...</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
